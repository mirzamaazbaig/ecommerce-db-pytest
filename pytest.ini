[pytest]
testpaths = tests
addopts = -ra --strict-markers --html=reports/report.html --self-contained-html
markers =
    schema: the structure of the database (tables, columns, keys)
    constraints: the database itself rejects invalid data
    migrations: the setup and migration scripts, run on throw-away databases (needs APP_REPO)
    integrity: data written by the application stays consistent (needs the API)
